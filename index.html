<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interface Angra</title>
    <!-- Set the font family to calibri-->
    <style>
        body {
            font-family: 'Calibri', sans-serif;
            text-align: center;
        }

        fieldset {
            margin-top: 20px;
            padding: 10px;
        }

        label {
            margin-right: 10px;
        }

        select,
        button {
            margin: 5px;
        }

        h3 {
            margin-top: 20px;
        }

        span {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: red;
        }

        span:hover {
            color: darkblue;
        }

        #config {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #header {
            background-color: #000000;
            /* Made the borders rounded */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #logo {
            display: flex;
            flex-direction: row;
            justify-content: center;
            width: 100%;
        }

        #logo img {
            display: flex;
            background-color: #ba0919;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 2px;
            margin-bottom: 2px;
            padding-left: 7px;
        }

        legend {
            background-color: #000;
            color: #fff;
            padding: 3px 6px;
        }

        #date-picker {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
        }

        #date-picker div {
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #date-picker div select {
            width: 100px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #myButton {
            background-color: #ba0919;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #myButton:disabled {
            background-color: #2f0408;
        }

        #title {
            font-weight: bold;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            color: cadetblue;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/v4-shims.min.css">
</head>

<body>
    <div id="header">
        <div id="logo">
            <!-- <img src=""
                alt="" width="200"> -->
        </div>
    </div>

    <h3 align="center" id="title">Gerador de OS Angra</h3>

    <div id="date-picker">
        <div>
            <label for="month">Mês</label>
            <select id="month">
                <option value="01">Janeiro</option>
                <option value="02">Fevereiro</option>
                <option value="03">Março</option>
                <option value="04">Abril</option>
                <option value="05">Maio</option>
                <option value="06">Junho</option>
                <option value="07">Julho</option>
                <option value="08">Agosto</option>
                <option value="09">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
        </div>

        <div>
            <label for="year">Ano</label>
            <select id="year">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
            </select>
        </div>

    </div>

    <button id="myButton">Gerar OS</button>

    <p id="status">O título da janela apresenta o status da operação.</p>

    <fieldset id="config">
        <legend>Configurações</legend>
        <div>
            <label for="skipGLPI">Ignorar GLPI:</label>
            <input type="checkbox" id="skipGLPI">
            <span title="Se marcado, não será coletados chamados novos do GLPI.">﹖</span>
        </div>
        <div>
            <label for="showOperation">Mostrar Operação:</label>
            <input type="checkbox" id="showOperation">
            <span title="Exibe o navegador cobaia que é usado para coletar chamados. APENAS PARA VISUALIZAÇÃO, NÃO UTILIZE-O.">﹖</span>
        </div>
        <div>
            <label for="ticketLimit">Limite de Chamados</label>
            <select id="ticketLimit">
                <option value="150">150</option>
                <option value="200">200</option>
                <option value="250">250</option>
                <option value="500" selected>500 (padrão)</option>
                <option value="750">750</option>
                <option value="1000">1000</option>
            </select>
            <span title="Quantidade de chamados coletados, abaixo de 500 não recomendado. Escala o tempo de espera.">﹖</span>
        </div>
        <div>
            <label for="setPath">Pasta de OS</label>
            <input type="button" id="setPath" value="Selecionar Pasta">
            <span title="Selecione a pasta onde as OS serão salvas.">﹖</span>
        </div>
    </fieldset>
</body>
<script src="./renderer.js"></script>

</html>
